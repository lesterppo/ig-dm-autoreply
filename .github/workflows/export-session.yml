name: Export IG session

# Session broker for the ig-vm CLI (headless, runs solely on the operator's
# VM). The VM dispatches this workflow with its RSA public key; the runner
# logs into Instagram with the repo secrets, encrypts the session so only
# the VM's private key can read it, and uploads it as an artifact the VM
# downloads. The Instagram password never leaves GitHub Secrets / the runner.

on:
  workflow_dispatch:
    inputs:
      pubkey_b64:
        description: "Base64 of PEM-encoded RSA public key (encrypts the session)"
        required: true
      mode:
        description: "session = real Instagram login; selftest = dummy payload"
        required: false
        default: "session"
        type: choice
        options: ["session", "selftest"]
      await_code:
        description: "One-time verification: wait for a challenge code committed as .challenge-code.json"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read   # poll .challenge-code.json via API when await_code=true
  actions: write   # upload the encrypted session artifact

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install instagrapi cryptography

      - name: Export encrypted session
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          PUBKEY_B64: ${{ inputs.pubkey_b64 }}
          MODE: ${{ inputs.mode }}
          AWAIT_CHALLENGE_CODE: ${{ inputs.await_code }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/export_session.py

      - name: Upload encrypted session artifact
        uses: actions/upload-artifact@v4
        with:
          name: ig-session
          path: automation/session.enc
          retention-days: 1
